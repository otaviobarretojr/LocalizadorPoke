<style>

.wrap{max-width:980px;margin:auto;padding:18px}.hero{padding:28px 0 14px}.eyebrow,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;background:#35191b;color:#ff9292}

.actions{display:flex;gap:8px}.caught{flex:1;cursor:pointer}.caught.on{background:#12321c;border-color:#246c38;color:#8cf0aa}.empty{text-align:center;color:#9ca3af;padding:60px 10px}.routeview{grid-column:1/-1;display:grid;gap:12px}.routegroup{background:#121821;border:1px solid #2a3442;border-radius:16px;padding:14px}.routehead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.routehead h2{font-size:18px;margin:0}.routecount{font-size:12px;font-weight:800;background:#1f2937;padding:6px 9px;border-radius:999px}.routechips{display:flex;flex-wrap:wrap;gap:7px}.routechip{border:1px solid #334155;background:#0b1220;color:inherit;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer}.routechip:hover{border-color:#64748b}.routeprogress{height:5px;background:#1f2937;border-radius:999px;overflow:hidden;margin:8px 0 11px}.routeprogress i{display:block;height:100%;background:currentColor}.routepct{font-size:11px;color:#94a3b8;margin-left:6px}.routehero{padding:14px;border-radius:16px;background:#0b1220;border:1px solid #3b82f6}.routehero small{display:block;color:#93c5fd;text-transform:uppercase;font-weight:800;letter-spacing:.06em}.routehero button,.routegroup .startbtn{margin-top:10px;width:100%;cursor:pointer;background:#172554;border:1px solid #1d4ed8;color:inherit;border-radius:11px;padding:10px;font-weight:800}.routehero strong{display:block;font-size:20px;margin:4px 0}.nextbtn{width:100%;margin-top:8px;cursor:pointer;background:#172554;border-color:#1d4ed8}.huntnote{font-size:11px;color:#93c5fd;text-align:center;margin-top:7px}.huntstatus{margin:10px 0;padding:11px;border:1px solid #334155;border-radius:13px;background:#111827}.huntstatusrow{display:flex;justify-content:space-between;gap:10px;font-size:12px}.huntstatusrow b{font-size:13px}.huntbar{height:5px;background:#1f2937;border-radius:999px;overflow:hidden;margin-top:8px}.huntbar i{display:block;height:100%;background:currentColor}

.needbox{margin:12px 0;padding:12px;border:1px solid #334155;border-radius:14px;background:#0b1220}.needtitle{font-weight:800;margin-bottom:8px}.needgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.needcell{padding:9px;border-radius:10px;background:#111827}.needcell b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;margin-bottom:3px}.warn{grid-column:1/-1;border-left:3px solid #f59e0b}@media(max-width:560px){.needgrid{grid-template-columns:1fr}.warn{grid-column:auto}}

.prio-high{border-left:4px solid #22c55e}.prio-med{border-left:4px solid #f59e0b}.prio-low{border-left:4px solid #64748b}

<body><main class="wrap">
<section class="hero"><span class="eyebrow">🔴 PALDEA • SCARLET</span><h1>Pokémon Locator</h1><p>Encontre, capture e complete sua Pokédex sem ficar rodando Paldea à toa.</p>
<div class="stats"><div class="stat"><b id="total">0</b><span>NO GUIA</span></div><div class="stat"><b id="caughtN">0</b><span>CAPTURADOS</span></div><div class="stat"><b id="missingN">0</b><span>FALTAM</span></div></div></section>
<div class="toolbar"><input id="q" autocomplete="off" placeholder="🔎 Procurar Pokémon..."><select id="filter"><option value="missing">Só faltam</option><option value="all">Todos</option><option value="recommended">⭐ Próximo recomendado</option><option value="route">🗺️ Rota por região</option><option value="scarlet">Scarlet exclusivos</option><option value="violet">Violet exclusivos</option></select></div>
<section id="grid" class="grid"></section><p class="note">O guia prioriza o caminho mais prático. Encounter Power é uma ajuda opcional e dura 30 minutos.</p>
</main>
<script>
const pokemon=[
{n:376,dex:984,name:"Great Tusk",types:["Ground","Fighting"],version:"scarlet",place:"Área Zero",fast:"Research Station 4",route:"Teleporte para a Research Station 4 e explore a grande caverna e áreas abertas próximas.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Ground ou Fighting",recipe:"Encounter Power de Ground/Fighting pode facilitar a busca. Não é obrigatório.",tip:"Faça voltas por áreas amplas para renovar os spawns."},
{n:377,dex:985,name:"Scream Tail",types:["Fairy","Psychic"],version:"scarlet",place:"Área Zero",fast:"Research Station 4",route:"Explore cavernas e áreas subterrâneas da Área Zero; renove os spawns caminhando entre setores.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Fairy ou Psychic",recipe:"Use Encounter Power do tipo desejado apenas se quiser acelerar a procura.",tip:"É exclusivo de Scarlet; em Violet, a obtenção normal é por troca/cooperação."},
{n:378,dex:986,name:"Brute Bonnet",types:["Grass","Dark"],version:"scarlet",place:"Área Zero",fast:"Research Station 2",route:"Procure em áreas gramadas e subterrâneas da Área Zero enquanto desce pelo crater.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Grass ou Dark",recipe:"Encounter Power de Grass/Dark ajuda a aumentar encontros compatíveis.",tip:"Percorra áreas gramadas e subterrâneas em ciclos curtos."},
{n:379,dex:987,name:"Flutter Mane",types:["Ghost","Fairy"],version:"scarlet",place:"Área Zero",fast:"Research Station 4",route:"Procure nas regiões subterrâneas e cavernas profundas da Área Zero.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Ghost ou Fairy",recipe:"Encounter Power de Ghost/Fairy pode tornar a busca mais eficiente.",tip:"Se os spawns estiverem ruins, saia do setor e retorne para renová-los."},
{n:380,dex:988,name:"Slither Wing",types:["Bug","Fighting"],version:"scarlet",place:"Área Zero • áreas externas",fast:"Research Station 1",route:"Saia da Research Station 1 e desça pelas áreas externas de grama e encostas.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Bug ou Fighting",recipe:"Encounter Power de Bug/Fighting pode reduzir encontros concorrentes.",tip:"Priorize áreas abertas e gramadas da Área Zero."},
{n:381,dex:989,name:"Sandy Shocks",types:["Electric","Ground"],version:"scarlet",place:"Área Zero • área rochosa",fast:"Research Station 2",route:"Saia da Research Station 2 e procure especificamente na área rochosa à esquerda da estação.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Electric ou Ground",recipe:"Encounter Power de Electric/Ground pode ajudar.",tip:"Este tem um ponto bem específico: área rochosa à esquerda da Research Station 2."},
{n:397,dex:1005,name:"Roaring Moon",types:["Dragon","Dark"],version:"scarlet",place:"Área Zero • caverna escondida",fast:"Research Station 3",route:"Teleporte para a Research Station 3 e procure a passagem estreita entre as rochas que leva à grande caverna escondida; faça ciclos dentro dela.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Dragon",recipe:"Encounter Power de Dragon é útil para aumentar os encontros; não é obrigatório.",tip:"É mais raro. O ponto decisivo é entrar na caverna escondida correta."}
]
const saved=new Set(JSON.parse(localStorage.getItem("caught")||"[]"));
const $=s=>document.querySelector(s);


function familyValue(p){
 const lines=[
  ["Larvitar","Pupitar","Tyranitar"],["Deino","Zweilous","Hydreigon"],["Bagon","Shelgon","Salamence"],
  ["Dreepy","Drakloak","Dragapult"],["Gulpin","Swalot"],["Clauncher","Clawitzer"],["Skrelp","Dragalge"],
  ["Drifloon","Drifblim"],["Stunky","Skuntank"],["Misdreavus","Mismagius"]
 ];
 const line=lines.find(x=>x.includes(p.name));
 if(!line) return 1;
 const first=line[0]===p.name;
 return first?line.length:1;
}
function priorityScore(p){
 if(saved.has(p.name)) return -999;
 let s=familyValue(p)*10;
 if(p.version==="violet") s+=6;
 if(/troca|Union Circle|999|1\.000|1000|amizade|Stone|Armor|Crest/i.test((p.method||"")+" "+(p.route||""))) s+=4;
 return s;
}
function priorityInfo(p){
 const v=familyValue(p), s=priorityScore(p);
 if(v>=3) return {cls:"prio-high",label:"⭐ Alta prioridade",why:`Pode render até ${v} registros da Pokédex pela mesma linha evolutiva.`};
 if(p.version==="violet") return {cls:"prio-high",label:"⭐ Alta prioridade",why:"Exclusivo de Violet: resolva por troca, cooperação ou método indicado."};
 if(s>=14) return {cls:"prio-med",label:"Prioridade média",why:"Possui condição especial; vale resolver quando você tiver o item/requisito."};
 return {cls:"prio-low",label:"Prioridade normal",why:"Pode ser concluído normalmente durante a exploração."};
}

function evoInfo(p){
 const m=p.method||""; let item="—",where="—",condition=m;
 const items=["Thunder Stone","Fire Stone","Ice Stone","Dusk Stone","Dawn Stone","Sun Stone","Leaf Stone","Auspicious Armor","Malicious Armor","King's Rock","Metal Coat"];
 item=items.find(x=>m.includes(x))||"—";
 if(item==="Thunder Stone"||item==="Fire Stone"||item==="Leaf Stone") where="Delibird Presents / exploração";
 else if(item==="Ice Stone") where="Dalizapa Passage / Glaseado Mountain";
 else if(item==="Dusk Stone") where="Montenevera / Area Zero / Porto Marinada";
 else if(item==="Dawn Stone") where="Area Zero / East Province A3 / West Province A3";
 else if(item==="Sun Stone") where="Artazon / Asado Desert / exploração";
 else if(item==="Auspicious Armor") where="Zapapico • 10 Bronzor Fragments";
 else if(item==="Malicious Armor") where="Zapapico (Violet) • 10 Sinistea Chips";
 else if(item==="King's Rock"||item==="Metal Coat") where="Delibird Presents";
 let warning="";
 if(/♀|fêmea/i.test(m+p.route)) warning="Confira o gênero: esta evolução exige fêmea.";
 else if(/♂|macho/i.test(m+p.route)) warning="Confira o gênero: esta evolução exige macho.";
 else if(/troca/i.test(m+p.route)) warning="Esta evolução pode exigir troca com outro jogador.";
 else if(/1\.000|1000|Let's Go/i.test(m+p.route)) warning="Mantenha o Pokémon fora da Poké Ball durante a caminhada e depois suba um nível.";
 else if(/amizade/i.test(m+p.route)) warning="A amizade precisa estar alta antes do nível que aciona a evolução.";
 return {item,where,condition,warning};
}
function requirementInfo(p){
 const x={
 "Armarouge":"Zapapico: entregue 10 Bronzor Fragments ao NPC da troca para receber Auspicious Armor; use em Charcadet.",
 "Ceruledge":"Em Violet, Zapapico: entregue 10 Sinistea Chips ao NPC para receber Malicious Armor. Em Scarlet, obtenha o item/Pokémon via troca.",
 "Scizor":"Metal Coat: Delibird Presents de Levincia. Equipe em Scyther e faça uma troca.",
 "Slowking":"King's Rock: pode ser comprado no Delibird Presents de Mesagoza após progresso suficiente. Equipe em Slowpoke e troque.",
 "Kingambit":"Leader's Crest: capture/derrote Bisharp que lideram grupos de Pawniard em North Province (Area Two); use um Bisharp com o Crest para vencer 3 líderes e suba um nível.",
 "Gholdengo":"999 Gimmighoul Coins: faça uma rota por Watchtowers/ruínas, derrotando ou capturando Chest Form e interagindo com Roaming Form.",
 "Polteageist":"Phony Sinistea usa Cracked Pot; Antique Sinistea usa Chipped Pot. Confira a marca na parte inferior antes de gastar o item.",
 "Weavile":"Razor Claw: obtenha o item, equipe em Sneasel e faça-o ganhar um nível durante a noite.",
 "Gallade":"Dawn Stone + Kirlia macho. Confirme o gênero antes de usar a pedra.",
 "Froslass":"Dawn Stone + Snorunt fêmea. Dawn Stone pode ser obtida por exploração/recompensas; confirme o gênero.",
 "Raichu":"Thunder Stone: Delibird Presents após o desbloqueio da loja; use diretamente em Pikachu.",
 "Magnezone":"Thunder Stone em Magneton; não exige área magnética em Scarlet/Violet.",
 "Cloyster":"Water Stone em Shellder; evolução imediata.",
 "Eelektross":"Thunder Stone em Eelektrik; evolução imediata.",
 "Leafeon":"Leaf Stone em Eevee; evolução imediata.",
 "Glaceon":"Ice Stone em Eevee; procure também em Dalizapa Passage/Glaseado Mountain.",
 "Cetitan":"Ice Stone em Cetoddle; Dalizapa Passage e Glaseado Mountain são bons pontos para procurar."
 };
 return x[p.name]||"";
}
function landmarkInfo(p){
 const x={
 "Roaring Moon":"Research Station 3 → saída → procure a passagem estreita entre as rochas que leva à grande caverna escondida.",
 "Sandy Shocks":"Research Station 2 → saia da estação → procure a formação rochosa elevada próxima; faça ciclos nessa área.",
 "Great Tusk":"Research Station 4 → explore a caverna principal e as áreas abertas próximas.",
 "Flutter Mane":"Desça para as cavernas profundas da Área Zero; faça ciclos nas áreas subterrâneas.",
 "Spiritomb":"Glaseado Mountain → percorra as encostas/ruínas e renove os spawns entre os pontos altos.",
 "Wo-Chien":"8 estacas roxas → Grasswither Shrine.",
 "Chien-Pao":"8 estacas amarelas → Icerend Shrine.",
 "Ting-Lu":"8 estacas verdes → Groundblight Shrine.",
 "Chi-Yu":"8 estacas azuis → Firescourge Shrine.",
 "Gimmighoul":"Use as Watchtowers como rota: suba ao topo para procurar Chest Form e colete moedas no caminho.",
 "Frigibax":"Glaseado Mountain → priorize cavernas e encostas rochosas nevadas.",
 "Ditto":"Arredores de Medali → mire nos Pokémon com ZL; Ditto estará disfarçado.",
 "Zorua":"Tagtree Thicket → mire com ZL nos Pokémon selvagens para revelar o disfarce."
 };
 return x[p.name]||"";
}
function navInfo(p){
 const evo=/Evolução|Evoluir|Nível|Stone|Amizade|Troca|Multiplayer|Coleta|Santuário/i.test(p.method+" "+p.place);
 const special=p.version==="violet"?"Em Scarlet: use troca/cooperação quando necessário.":p.version==="scarlet"?"Disponível diretamente em Scarlet.":"Disponível nas duas versões.";
 return {destination:p.place,start:p.fast,action:p.route,condition:(p.time&&p.time!=="Qualquer período"?p.time+" • ":"")+p.method,version:special,evo};
}
function artwork(id){return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"+id+".png"}
function stats(){total.textContent=pokemon.length;caughtN.textContent=pokemon.filter(p=>saved.has(p.n)).length;missingN.textContent=pokemon.filter(p=>!saved.has(p.n)).length}
function routeKey(p){let s=p.place;if(/Área Zero/i.test(s))return "Área Zero";if(/Glaseado/i.test(s))return "Glaseado Mountain";if(/Asado/i.test(s))return "Asado Desert";if(/Tagtree/i.test(s))return "Tagtree Thicket";if(/Casseroya/i.test(s))return "Casseroya Lake";if(/North Province/i.test(s))return "North Province";if(/West Province/i.test(s))return "West Province";if(/East Province/i.test(s))return "East Province";if(/South Province/i.test(s))return "South Province";if(/Zapapico/i.test(s))return "Zapapico";if(/Levincia/i.test(s))return "Levincia";if(/Medali/i.test(s))return "Medali";if(/Evolução|Troca|Union Circle/i.test(s))return "Evoluções / trocas";if(/Santuário|Shrine/i.test(s))return "Santuários";return s.split(" / ")[0].split(" • ")[0]}
function openPokemon(name){q.value=name;filter.value="all";draw();requestAnimationFrame(()=>{const d=document.querySelector(".guidefold");if(d)d.open=true;window.scrollTo({top:0,behavior:"smooth"})})}
function huntScore(p){let s=0;if(p.version==="violet")s+=100;if(/Troca|Multiplayer|Union Circle/i.test((p.method||"")+" "+(p.place||"")))s+=60;if(/999|Santuário|Shrine|Crest|Armor|Stone|amizade|Rage Fist|Hyper Drill|Twin Beam/i.test((p.method||"")+" "+(p.route||"")))s+=25;if(/Selvagem/i.test(p.method||""))s-=30;if(p.version==="scarlet")s-=10;return s}
function huntSort(a,b){return huntScore(a)-huntScore(b)||a.n-b.n}
function nextInRegion(n){const cur=pokemon.find(p=>p.n===n);if(!cur)return;const k=routeKey(cur),left=pokemon.filter(p=>routeKey(p)===k&&!saved.has(p.n)&&p.n!==n).sort(huntSort);if(left.length)openPokemon(left[0].name);else{q.value="";filter.value="route";draw()}}
function huntStatus(n){const cur=pokemon.find(p=>p.n===n);if(!cur)return"";const k=routeKey(cur),all=pokemon.filter(p=>routeKey(p)===k),caught=all.filter(p=>saved.has(p.n)).length,total=all.length,pct=total?Math.round(caught/total*100):0,left=all.filter(p=>!saved.has(p.n)).length;return `<div class="huntstatus"><div class="huntstatusrow"><b>🗺️ ${k}</b><span>${caught}/${total} • ${pct}%</span></div><div class="huntbar"><i style="width:${pct}%"></i></div><div class="huntstatusrow" style="margin-top:7px"><span>Sessão regional</span><span>${left} faltando</span></div></div>`}
function nextLabel(n){const cur=pokemon.find(p=>p.n===n);if(!cur)return"";const left=pokemon.filter(p=>routeKey(p)===routeKey(cur)&&!saved.has(p.n)&&p.n!==n).sort(huntSort);return left.length?"Próximo da região: "+left[0].name:"Região concluída • voltar à rota"}
function startRegion(region){const list=pokemon.filter(p=>routeKey(p)===region&&!saved.has(p.n)).sort(huntSort);if(list.length)openPokemon(list[0].name)}
function routeView(a){const all={};for(const p of pokemon){const k=routeKey(p);(all[k]??=[]).push(p)}const groups={};for(const p of a){const k=routeKey(p);(groups[k]??=[]).push(p)}const ordered=Object.entries(groups).sort((x,y)=>{const ax=x[1].filter(p=>huntScore(p)<60).length,ay=y[1].filter(p=>huntScore(p)<60).length;return ay-ax||y[1].length-x[1].length||x[0].localeCompare(y[0])});const hero=ordered.length?'<div class="routehero"><small>🎯 Vá primeiro para</small><strong>'+ordered[0][0]+'</strong><span>'+ordered[0][1].length+' Pokémon pendentes nesta região</span><button onclick="startRegion(&quot;'+ordered[0][0]+'&quot;)">▶ Iniciar rota recomendada</button></div>':'';return '<div class="routeview">'+hero+ordered.map(([k,ps])=>{const total=all[k]?.length||ps.length,caught=total-ps.length,pct=Math.round(caught/total*100);return '<section class="routegroup"><div class="routehead"><h2>📍 '+k+' <span class="routepct">'+caught+'/'+total+' • '+pct+'%</span></h2><span class="routecount">'+ps.length+' faltando</span></div><div class="routeprogress"><i style="width:'+pct+'%"></i></div><button class="startbtn" onclick="startRegion(&quot;'+k+'&quot;)">▶ Começar por '+ps.slice().sort(huntSort)[0].name+'</button><div class="routechips">'+ps.sort(huntSort).map(p=>'<button class="routechip" onclick="openPokemon(\''+p.name.replace(/'/g,"\\'")+'\')"><b>#'+String(p.n).padStart(3,"0")+'</b> '+p.name+'</button>').join("")+'</div></section>'}).join("")+'</div>'}
function draw(){const term=q.value.trim().toLowerCase(),f=filter.value;let a=pokemon.filter(p=>p.name.toLowerCase().includes(term)||String(p.n).includes(term));if(f==="missing")a=a.filter(p=>!saved.has(p.n));if(f==="scarlet")a=a.filter(p=>p.version==="scarlet");if(f==="violet")a=a.filter(p=>p.version==="violet");if(f==="recommended")a=a.filter(p=>!saved.has(p.n)).sort((x,y)=>priorityScore(y)-priorityScore(x)).slice(0,12);if(f==="route"){a=a.filter(p=>!saved.has(p.n));grid.innerHTML=routeView(a)||\'<div class="empty">Pokédex completa! 🎉</div>\';stats();return}
grid.innerHTML=a.map(p=>`<article class="card"><div class="visual"><img loading="lazy" src="${artwork(p.dex)}" alt="${p.name}"></div><div class="body"><div class="top"><div><div class="num">Paldea #${p.n}</div><h2>${p.name}</h2></div><span class="tag">${p.version==="violet"?"🟣 Violet":p.version==="both"?"🔵 Ambas":"🔴 Scarlet"}</span></div><div class="types">${p.types.map(t=>`<span class="type">${t}</span>`).join("")}</div>
<div class="row"><div class="label">📍 Melhor local</div><div class="value">${p.place}</div></div><details class="guidefold"><summary>🧭 Abrir GPS / guia completo</summary><div class="guidecontent"><div class="navbox">${(()=>{const n=navInfo(p);return `<div class="navtitle">🗺️ Navegação rápida</div><div class="navstep"><span>1️⃣</span><div><b>Destino:</b> ${n.destination}</div></div><div class="navstep"><span>2️⃣</span><div><b>Comece por:</b> ${n.start}</div></div><div class="navstep"><span>3️⃣</span><div><b>Faça:</b> ${n.action}</div></div><div class="navstep"><span>⚙️</span><div><b>Condição:</b> ${n.condition}</div></div><div class="navmeta">${n.version}</div>${(()=>{const l=landmarkInfo(p);return l?`<div class="landmark"><b>📌 Ponto de referência</b>${l}</div>`:""})()}${(()=>{const r=requirementInfo(p);return r?`<div class="reqmap"><b>🎒 Onde conseguir o requisito</b>${r}</div>`:""})()}`})()}</div><div class="row"><div class="label">🧭 Partida</div><div class="value">${p.fast}</div></div><div class="row"><div class="label">➡️ Caminho</div><div class="value">${(()=>{const z=priorityInfo(p);return `<div class="priority ${z.cls}"><b>${z.label}</b>${z.why}</div>`})()}${(()=>{const e=evoInfo(p);return `<div class="needbox"><div class="needtitle">🧭 Guia rápido</div><div class="needgrid"><div class="needcell"><b>📦 Item necessário</b>${e.item}</div><div class="needcell"><b>📍 Onde conseguir</b>${e.where}</div><div class="needcell"><b>⚙️ Como evoluir</b>${e.condition}</div>${e.warning?`<div class="needcell warn"><b>⚠️ Condição especial</b>${e.warning}</div>`:""}</div></div>`})()}${p.route}</div></div>
<div class="row"><div class="label">🎯 Método</div><div class="value">${p.method}</div></div><div class="row"><div class="label">🕐 Horário</div><div class="value">${p.time}</div></div>
<details><summary>🥪 Sanduíche / Encounter Power</summary><div class="recipe"><b>Tipo recomendado:</b> ${p.encounter}<br>${p.recipe}<br><span class="muted">Meal Powers permanecem ativos por 30 min.</span></div></details>
<details><summary>💡 Dica de captura</summary><div class="recipe">${p.tip}</div></details></div></details>
${huntStatus(p.n)}<div class="actions"><button class="caught ${saved.has(p.n)?"on":""}" onclick="toggleCaught(${p.n},true)">${saved.has(p.n)?"✓ Capturado":"✓ Capturei • próximo"}</button></div><button class="nextbtn" onclick="nextInRegion(${p.n})">➡️ ${nextLabel(p.n)}</button><div class="huntnote">Ao marcar uma captura, a sessão avança automaticamente dentro desta região.</div></div></article>`).join("")||'<div class="empty">Nenhum Pokémon encontrado nesse filtro.</div>';stats()}
function toggleCaught(n,advance=false){const was=saved.has(n);if(was)saved.delete(n);else saved.add(n);localStorage.setItem("caught",JSON.stringify([...saved]));if(advance&&!was){const cur=pokemon.find(p=>p.n===n),k=cur&&routeKey(cur),left=pokemon.filter(p=>k&&routeKey(p)===k&&!saved.has(p.n)&&p.n!==n).sort(huntSort);if(left.length){openPokemon(left[0].name);return}q.value="";filter.value="route";draw();return}draw()}
q.addEventListener("input",draw);filter.addEventListener("change",draw);draw();
</script></body></html,
