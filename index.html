<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10"><title>Pokémon Scarlet Locator</title>
<style>
:root{color-scheme:dark;--red:#ef4444;--bg:#090b10;--card:#141821;--muted:#9ca3af;--line:#282f3b;--green:#22c55e}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#241014 0,#090b10 38%);color:#fff}
.wrap{max-width:980px;margin:auto;padding:18px}.hero{padding:28px 0 14px}.eyebrow,.tag{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;background:#35191b;color:#ff9292}
h1{margin:10px 0 5px;font-size:clamp(30px,8vw,52px);letter-spacing:-.04em}.hero p,.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{background:#121720;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;position:sticky;top:0;z-index:10;background:#090b10e8;backdrop-filter:blur(14px);padding:12px 0}
input,select,button{border:1px solid var(--line);border-radius:13px;background:#11151d;color:#fff;padding:13px;font-size:15px}input{flex:1;min-width:210px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{overflow:hidden;background:linear-gradient(180deg,#171c25,#11151c);border:1px solid var(--line);border-radius:22px}
.visual{height:190px;display:grid;place-items:center;background:radial-gradient(circle,#3b1b20 0,#171b23 60%)}.visual img{height:170px;width:170px;object-fit:contain;filter:drop-shadow(0 12px 18px #0008)}
.body{padding:17px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.num{color:#7f8795;font-weight:700}.top h2{margin:2px 0 0;font-size:24px}
.types{display:flex;gap:6px;margin:10px 0}.type{font-size:12px;background:#242b36;padding:5px 8px;border-radius:8px}
.row{padding:11px 0;border-top:1px solid #242a34}.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#7f8795}.value{margin-top:5px;line-height:1.45}
details{border-top:1px solid #242a34;padding:11px 0}summary{cursor:pointer;font-weight:700}.recipe{margin-top:10px;padding:12px;background:#0d1118;border-radius:12px;line-height:1.5}
.actions{display:flex;gap:8px}.caught{flex:1;cursor:pointer}.caught.on{background:#12321c;border-color:#246c38;color:#8cf0aa}.empty{text-align:center;color:#9ca3af;padding:60px 10px}
.note{font-size:12px;color:#7f8795;margin:16px 2px 40px}@media(max-width:480px){.wrap{padding:13px}.grid{grid-template-columns:1fr}.visual{height:170px}.visual img{height:155px}}
</style></head>
<body><main class="wrap">
<section class="hero"><span class="eyebrow">🔴 PALDEA • SCARLET</span><h1>Pokémon Locator</h1><p>Encontre, capture e complete sua Pokédex sem ficar rodando Paldea à toa.</p>
<div class="stats"><div class="stat"><b id="total">0</b><span>NO GUIA</span></div><div class="stat"><b id="caughtN">0</b><span>CAPTURADOS</span></div><div class="stat"><b id="missingN">0</b><span>FALTAM</span></div></div></section>
<div class="toolbar"><input id="q" autocomplete="off" placeholder="🔎 Procurar Pokémon..."><select id="filter"><option value="missing">Só faltam</option><option value="all">Todos</option><option value="scarlet">Scarlet exclusivos</option></select></div>
<section id="grid" class="grid"></section><p class="note">O guia prioriza o caminho mais prático. Encounter Power é uma ajuda opcional e dura 30 minutos.</p>
</main>
<script>
const pokemon=[
{n:376,dex:984,name:"Great Tusk",types:["Ground","Fighting"],version:"scarlet",place:"Área Zero",fast:"Research Station 4",route:"Teleporte para a Research Station 4 e explore a grande caverna e áreas abertas próximas.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Ground ou Fighting",recipe:"Encounter Power de Ground/Fighting pode facilitar a busca. Não é obrigatório.",tip:"Faça voltas por áreas amplas para renovar os spawns."},
{n:377,dex:985,name:"Scream Tail",types:["Fairy","Psychic"],version:"scarlet",place:"Área Zero",fast:"Research Station 4",route:"Explore cavernas e áreas subterrâneas da Área Zero; renove os spawns caminhando entre setores.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Fairy ou Psychic",recipe:"Use Encounter Power do tipo desejado apenas se quiser acelerar a procura.",tip:"É exclusivo de Scarlet; em Violet, a obtenção normal é por troca/cooperação."},
{n:378,dex:986,name:"Brute Bonnet",types:["Grass","Dark"],version:"scarlet",place:"Área Zero",fast:"Research Station 2",route:"Procure em áreas gramadas e subterrâneas da Área Zero enquanto desce pelo crater.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Grass ou Dark",recipe:"Encounter Power de Grass/Dark ajuda a aumentar encontros compatíveis.",tip:"Percorra áreas gramadas e subterrâneas em ciclos curtos."},
{n:379,dex:987,name:"Flutter Mane",types:["Ghost","Fairy"],version:"scarlet",place:"Área Zero",fast:"Research Station 4",route:"Procure nas regiões subterrâneas e cavernas profundas da Área Zero.",time:"Área Zero",method:"Selvagem • Paradox • pós-jogo",encounter:"Ghost ou Fairy",recipe:"Encounter Power de Ghost/Fairy pode tornar a busca mais eficiente.",tip:"Se os spawns estiverem ruins, saia do setor e retorne para renová-los."},
{n:380,dex:988,name:"Slither Wing",types:["Bug","Fighting"],version:"scarlet",place:"Área Zero • áreas externas",fast:"Research Station 1",route:"Saia da Research Station 1 e desça pelas áreas externas de grama e encostas.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Bug ou Fighting",recipe:"Encounter Power de Bug/Fighting pode reduzir encontros concorrentes.",tip:"Priorize áreas abertas e gramadas da Área Zero."},
{n:381,dex:989,name:"Sandy Shocks",types:["Electric","Ground"],version:"scarlet",place:"Área Zero • área rochosa",fast:"Research Station 2",route:"Saia da Research Station 2 e procure especificamente na área rochosa à esquerda da estação.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Electric ou Ground",recipe:"Encounter Power de Electric/Ground pode ajudar.",tip:"Este tem um ponto bem específico: área rochosa à esquerda da Research Station 2."},
{n:397,dex:1005,name:"Roaring Moon",types:["Dragon","Dark"],version:"scarlet",place:"Área Zero • caverna escondida",fast:"Research Station 3",route:"Teleporte para a Research Station 3 e procure a passagem estreita entre as rochas que leva à grande caverna escondida; faça ciclos dentro dela.",time:"Qualquer período",method:"Selvagem • Paradox • pós-jogo",encounter:"Dragon",recipe:"Encounter Power de Dragon é útil para aumentar os encontros; não é obrigatório.",tip:"É mais raro. O ponto decisivo é entrar na caverna escondida correta."}
]
const saved=new Set(JSON.parse(localStorage.getItem("caught")||"[]"));
const $=s=>document.querySelector(s);
function artwork(id){return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"+id+".png"}
function stats(){total.textContent=pokemon.length;caughtN.textContent=pokemon.filter(p=>saved.has(p.n)).length;missingN.textContent=pokemon.filter(p=>!saved.has(p.n)).length}
function draw(){const term=q.value.trim().toLowerCase(),f=filter.value;let a=pokemon.filter(p=>p.name.toLowerCase().includes(term)||String(p.n).includes(term));if(f==="missing")a=a.filter(p=>!saved.has(p.n));if(f==="scarlet")a=a.filter(p=>p.version==="scarlet");
grid.innerHTML=a.map(p=>`<article class="card"><div class="visual"><img loading="lazy" src="${artwork(p.dex)}" alt="${p.name}"></div><div class="body"><div class="top"><div><div class="num">Paldea #${p.n}</div><h2>${p.name}</h2></div><span class="tag">🔴 Scarlet</span></div><div class="types">${p.types.map(t=>`<span class="type">${t}</span>`).join("")}</div>
<div class="row"><div class="label">📍 Melhor local</div><div class="value">${p.place}</div></div><div class="row"><div class="label">🧭 Partida</div><div class="value">${p.fast}</div></div><div class="row"><div class="label">➡️ Caminho</div><div class="value">${p.route}</div></div>
<div class="row"><div class="label">🎯 Método</div><div class="value">${p.method}</div></div><div class="row"><div class="label">🕐 Horário</div><div class="value">${p.time}</div></div>
<details><summary>🥪 Sanduíche / Encounter Power</summary><div class="recipe"><b>Tipo recomendado:</b> ${p.encounter}<br>${p.recipe}<br><span class="muted">Meal Powers permanecem ativos por 30 min.</span></div></details>
<details><summary>💡 Dica de captura</summary><div class="recipe">${p.tip}</div></details>
<div class="actions"><button class="caught ${saved.has(p.n)?"on":""}" onclick="toggleCaught(${p.n})">${saved.has(p.n)?"✓ Capturado":"Marcar como capturado"}</button></div></div></article>`).join("")||'<div class="empty">Nenhum Pokémon encontrado nesse filtro.</div>';stats()}
function toggleCaught(n){saved.has(n)?saved.delete(n):saved.add(n);localStorage.setItem("caught",JSON.stringify([...saved]));draw()}
q.addEventListener("input",draw);filter.addEventListener("change",draw);draw();
</script></body></html>
