<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Scarlet Locator</title>
<style>
:root{color-scheme:dark;--red:#ef4444;--bg:#090b10;--card:#141821;--muted:#9ca3af}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#fff}.wrap{max-width:900px;margin:auto;padding:20px}header{padding:28px 0 18px}h1{margin:0;font-size:clamp(27px,7vw,46px)}header p,.muted{color:var(--muted)}.search{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:#090b10e8;backdrop-filter:blur(10px);padding:12px 0;z-index:5}input,select,button{border:1px solid #2a303c;border-radius:13px;background:#11151d;color:#fff;padding:13px;font-size:15px}input{flex:1;min-width:210px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:var(--card);border:1px solid #262c38;border-radius:20px;padding:18px}.top{display:flex;justify-content:space-between;gap:12px}.num{color:#818896}.tag{display:inline-block;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700;background:#35191b;color:#ff8585}.row{margin:12px 0}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7f8795}.value{margin-top:4px;line-height:1.45}.caught{width:100%;margin-top:10px;cursor:pointer}.caught.on{background:#16351f;border-color:#27743b}.empty{text-align:center;color:#9ca3af;padding:50px 10px}
</style></head>
<body><div class="wrap"><header><div class="tag">PALDEA • SCARLET</div><h1>Pokémon Locator</h1><p>Guia de captura para completar sua Pokédex.</p></header>
<div class="search"><input id="q" placeholder="🔎 Procurar Pokémon..."><select id="filter"><option value="all">Todos</option><option value="missing">Só faltam</option><option value="scarlet">Scarlet exclusivos</option></select></div>
<div id="grid" class="grid"></div></div>
<script>
const pokemon=[
{n:376,name:"Great Tusk",version:"scarlet",place:"Área Zero",fast:"Research Station 4",route:"Teleporte para a Research Station 4 e procure pela grande caverna e áreas próximas.",time:"Qualquer período",method:"Captura selvagem • Paradox",food:"Encounter Power: Ground ou Fighting pode facilitar a busca."},
{n:380,name:"Slither Wing",version:"scarlet",place:"Área Zero",fast:"Research Station 1",route:"Saia da Station 1 e procure nas áreas externas de grama e encostas enquanto desce pela Área Zero.",time:"Qualquer período",method:"Captura selvagem • Paradox",food:"Encounter Power: Bug ou Fighting pode ajudar."},
{n:397,name:"Roaring Moon",version:"scarlet",place:"Área Zero • caverna escondida",fast:"Research Station 3",route:"Saia da Station 3 e procure a passagem estreita entre as rochas que leva à grande caverna escondida.",time:"Qualquer período",method:"Captura selvagem • Paradox",food:"Encounter Power: Dragon ou Dark é útil para aumentar os encontros."}
];
const saved=new Set(JSON.parse(localStorage.getItem("caught")||"[]"));
function draw(){const q=document.querySelector("#q").value.toLowerCase(),f=document.querySelector("#filter").value;let a=pokemon.filter(p=>p.name.toLowerCase().includes(q));if(f==="missing")a=a.filter(p=>!saved.has(p.n));if(f==="scarlet")a=a.filter(p=>p.version==="scarlet");grid.innerHTML=a.map(p=>`<article class="card"><div class="top"><div><div class="num">#${p.n}</div><h2>${p.name}</h2></div><span class="tag">🔴 Scarlet</span></div><div class="row"><div class="label">📍 Local</div><div class="value">${p.place}</div></div><div class="row"><div class="label">🧭 Viagem rápida</div><div class="value">${p.fast}</div></div><div class="row"><div class="label">Como chegar</div><div class="value">${p.route}</div></div><div class="row"><div class="label">🕐 Horário</div><div class="value">${p.time}</div></div><div class="row"><div class="label">🎯 Método</div><div class="value">${p.method}</div></div><div class="row"><div class="label">🥪 Dica</div><div class="value">${p.food}</div></div><button class="caught ${saved.has(p.n)?"on":""}" onclick="toggle(${p.n})">${saved.has(p.n)?"✓ Capturado":"Marcar como capturado"}</button></article>`).join("")||'<div class="empty">Nenhum Pokémon encontrado.</div>'}
function toggle(n){saved.has(n)?saved.delete(n):saved.add(n);localStorage.setItem("caught",JSON.stringify([...saved]));draw()}q.oninput=draw;filter.onchange=draw;draw();
</script></body></html>
